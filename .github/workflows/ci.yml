name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Fixada por SHA, a action não pode ser trocada por código hostil depois
      # da revisão: a tag é móvel, o commit não. O passo pega tag colada por
      # engano e regressão, mas não substitui a revisão: o PR roda a versão do
      # script que ele mesmo traz, e o script não confere se o SHA é da action
      # (ver .github/scripts/checa-actions-fixadas.py).
      - name: Actions fixadas por SHA
        run: python3 .github/scripts/checa-actions-fixadas.py

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Cache build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .astro
            dist
          key: build-${{ hashFiles('src/**/*', 'public/**/*', 'astro.config.mjs', 'package-lock.json') }}
          restore-keys: |
            build-

      - name: Install dependencies
        run: npm ci

      - name: Run CI (Typecheck, Lint, Build)
        run: npm run ci

      - name: Audit dependencies (High severity)
        run: npm audit --audit-level=high || true
