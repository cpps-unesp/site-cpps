name: 'Dependabot: Auto Merge'

# pull_request_target roda com o token do repositório base (em `pull_request`
# os PRs do Dependabot recebem token somente leitura). É seguro aqui porque o
# job não faz checkout nem executa código do PR.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot-auto-merge:
    # Exige Dependabot como autor do PR e do evento: um push humano na branch
    # do Dependabot não deve ser aprovado automaticamente. Não é preciso
    # cancelar um auto-merge ativado antes: o ruleset de main descarta a
    # aprovação a cada push (dismiss_stale_reviews_on_push), e sem nova
    # aprovação o PR não entra.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # Entra sozinho:
      #  - github-actions, qualquer tipo de atualização. O raio de dano é só o
      #    CI, nunca o site publicado, e um CI quebrado bloqueia merge em vez de
      #    publicar defeito. O risco de tag móvel sequestrada não se aplica:
      #    todas as actions são fixadas por SHA, e o passo "Actions fixadas por
      #    SHA" do check `ci` reprova o PR que reintroduzir uma tag.
      #  - npm, patch ou minor, e nenhum minor em pacote 0.x (em 0.y.z o minor
      #    quebra compatibilidade; ^0.35 não aceita 0.36). Sem versão anterior
      #    conhecida, o minor também fica para revisão.
      # Major de npm nunca entra sozinho: o Astro 6->7 (#349) precisou de gente
      # para descobrir que um override de vite guardava o build.
      - name: Decidir se o PR entra sozinho
        id: decisao
        run: |
          if [ "$ECOSYSTEM" = 'github-actions' ]; then
            echo "::notice::Atualização de action: entra sozinho se o check ci passar."
            echo 'auto=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$ECOSYSTEM" != 'npm_and_yarn' ]; then
            echo "::notice::Ecossistema $ECOSYSTEM fica para revisão humana."
            echo 'auto=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$UPDATE_TYPE" != 'version-update:semver-patch' ] && [ "$UPDATE_TYPE" != 'version-update:semver-minor' ]; then
            echo "::notice::Atualização ${UPDATE_TYPE:-sem tipo} fica para revisão humana."
            echo 'auto=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          zero_minor="$(jq -r '[.[] | select(.updateType == "version-update:semver-minor" and ((.prevVersion // "0.") | test("^v?0\\."))) | .dependencyName] | join(", ")' <<< "$DEPS")"
          if [ -n "$zero_minor" ]; then
            echo "::notice::Minor em pacote 0.x ($zero_minor) fica para revisão humana."
            echo 'auto=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'auto=true' >> "$GITHUB_OUTPUT"
        env:
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEPS: ${{ steps.metadata.outputs.updated-dependencies-json }}

      # Sem o check `ci` obrigatório, `gh pr merge --auto` faz merge na hora,
      # sem esperar o CI. Falha em vez de aprovar nesse caso. O endpoint de
      # rules é público em repo público; em repo privado a chamada falha e o
      # job também para.
      - name: Exigir o check ci na branch base
        if: steps.decisao.outputs.auto == 'true'
        run: |
          required="$(gh api "repos/$REPO/rules/branches/$BASE_REF" \
            --jq 'any(.[]; .type == "required_status_checks" and any(.parameters.required_status_checks[]; .context == "ci"))')"
          if [ "$required" != 'true' ]; then
            echo "::error::$BASE_REF não exige o check ci; auto-merge cancelado."
            exit 1
          fi
        env:
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Aprovar e ativar auto-merge
        if: steps.decisao.outputs.auto == 'true'
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
