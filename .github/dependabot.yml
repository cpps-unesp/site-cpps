version: 2
updates:
  # Um PR por dependência; patch e minor entram sozinhos quando o check `ci`
  # passa (ver workflows/dependabot-auto-merge.yml). Sem `groups` de propósito:
  # com um PR de grupo aberto o Dependabot deixa de abrir PRs de major
  # (dependabot-core#14202).
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
    # O padrão do Dependabot é 3 dias. Com auto-merge ligado, minor e major
    # esperam mais para dar tempo de detectar uma release comprometida.
    # Não vale para security updates.
    cooldown:
      default-days: 7
      semver-patch-days: 3
    ignore:
      - dependency-name: 'lodash'
        versions:
          - '<=4.17.21'
      - dependency-name: 'eslint'
        versions:
          - '>=10'
      # eslint-plugin-astro >= 2 exige eslint 10 (ignorado acima).
      - dependency-name: 'eslint-plugin-astro'
        versions:
          - '>=2'
      # @astrojs/check só aceita typescript ^5 || ^6.
      - dependency-name: 'typescript'
        versions:
          - '>=7'
      # Acompanha o Node LTS (.nvmrc = lts/*): atualizar junto com a troca de LTS.
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'

  # Mantém atualizados os SHAs das actions. Esses PRs entram sozinhos quando o
  # check `ci` passa (ver workflows/dependabot-auto-merge.yml): o raio de dano é
  # só o CI, e o passo "Actions fixadas por SHA" do `ci` garante que nenhuma
  # volte a apontar para tag móvel.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    labels:
      - 'dependencies'
    cooldown:
      default-days: 7
